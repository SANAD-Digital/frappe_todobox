<script>
/* the Desk's own typeface, as last seen in the Desk (public/js/desk_font.js) — e.g. a theme's custom font */
(function () {
	try {
		var d = JSON.parse(localStorage.getItem("todobox:desk-font") || "null");
		var f = d && String(d.family || d.stack || "").replace(/[{}<>;\\]/g, "").trim();
		if (!f) return;
		(d.links || []).forEach(function (h) {
			if (!/^https:\/\/fonts\.googleapis\.com\//.test(h)) return;
			var l = document.createElement("link"); l.rel = "stylesheet"; l.href = h; document.head.appendChild(l);
		});
		var s = document.createElement("style");
		s.id = "tb-desk-font-user";
		s.textContent = ":root{--font-stack:" + f + " !important}";
		document.head.appendChild(s);
	} catch (e) { /* private mode or nothing saved: the Desk's CSS defaults above apply */ }
})();
</script>

<script>
/* ToDoBox boot splash: theme before first paint, then reveal the app once it has
   rendered real data with its fonts (or fall back after a timeout). */
(function () {
	var d = document.documentElement, k = null, den = null;
	try { k = localStorage.getItem('todobox_dark'); den = localStorage.getItem('todobox_density'); } catch (e) {}
	var dark = k === '1' || (k !== '0' && !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches));
	d.setAttribute('data-dark', dark ? '1' : '0');
	if (den === 'normal' || den === 'comfortable') d.setAttribute('data-density', den);
	var acc = null;
	try { acc = localStorage.getItem('todobox_accent'); } catch (e) {}
	var cu = null;
	if (acc === 'custom') { try { cu = JSON.parse(localStorage.getItem('todobox_accent_custom') || 'null'); } catch (e) {} }
	var hx = /^#[0-9a-f]{6}$/i;
	if (cu && hx.test(cu.l) && hx.test(cu.d)) { d.style.setProperty('--cu-l', cu.l); d.style.setProperty('--cu-d', cu.d); }
	else if (acc === 'custom') acc = null;
	d.setAttribute('data-accent', /^(todobox|classic|teal|indigo|green|orange|graphite|maroon|brown|custom)$/.test(acc || '') ? acc : 'todobox');
	var tc = document.querySelector('meta[name="theme-color"]');
	if (tc) tc.setAttribute('content', dark ? '#1f1f1f' : '#ffffff');

	var S = window.TMSplash = { t0: Date.now(), done: false, failed: false }, poll = null;
	function el() { return document.getElementById('tm-splash'); }
	function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
	function frame() { return new Promise(function (r) { requestAnimationFrame(function () { r(); }); }); }
	/* the first frames before the API layer loads are placeholders — never show those */
	function usable() { return !!S.apiReady && Date.now() - S.apiReady > 4000 && !!document.querySelector('#dc-root .tt-app'); }
	S.reveal = function () {
		if (S.done) return;
		S.done = true;
		clearTimeout(S.slowTimer); clearTimeout(S.hardTimer); clearInterval(poll);
		d.classList.add('tm-ready');
		var e = el();
		if (!e) return;
		e.setAttribute('aria-busy', 'false');
		e.classList.add('tm-out');
		setTimeout(function () { if (e.parentNode) e.parentNode.removeChild(e); }, 260);
	};
	/* called by the app after its first data load has been rendered */
	S.ready = function () {
		if (S.done || S.failed) return;
		var fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
		frame().then(frame)
			.then(function () { return Promise.race([fonts, wait(3000)]); })
			.then(frame)
			.then(S.reveal, S.reveal);
	};
	S.fail = function () {
		if (S.done) return;
		S.failed = true;
		clearTimeout(S.slowTimer); clearTimeout(S.hardTimer); clearInterval(poll);
		var e = el();
		if (!e) return;
		e.classList.add('tm-err');
		e.setAttribute('aria-busy', 'false');
		var b = e.querySelector('button');
		if (b) try { b.focus(); } catch (x) {}
	};
	/* safety net: after 8s show whatever has rendered; if nothing has, say so and keep waiting */
	S.slowTimer = setTimeout(function () {
		if (S.done || S.failed) return;
		if (usable()) return S.reveal();
		var e = el();
		if (e) e.classList.add('tm-slow');
		poll = setInterval(function () { if (usable()) S.reveal(); }, 250);
		S.hardTimer = setTimeout(function () { if (!S.done) S.fail(); }, 22000);
	}, 8000);
})();
</script>

<body>
<div id="tm-splash" role="status" aria-live="polite" aria-busy="true" aria-label="{{ _('Loading ToDoBox') }}">
	<div class="tms-card">
		<img class="tms-logo" src="/assets/todobox/images/todobox.svg" alt="" aria-hidden="true">
		<div class="tms-name">{{ _("ToDoBox") }}</div>
		<div class="tms-bar" aria-hidden="true"><i></i></div>
		<div class="tms-msg">{{ _("Taking longer than usual…") }}</div>
		<div class="tms-err" role="alert">
			<b>{{ _("Couldn't load ToDoBox") }}</b>
			<span>{{ _("Check your connection and try again.") }}</span>
			<button type="button" onclick="location.reload()">{{ _("Retry") }}</button>
		</div>
	</div>
</div>

  <header class="tt-navbar navbar" style="{{ headerStyle }}">
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button type="button" class="sidebar-toggle-btn" data-sidebar-toggle="" onClick="{{ sidebarToggle }}" aria-controls="tt-nav" aria-expanded="{{ sidebarExpanded }}" aria-label="{{ sidebarToggleLabel }}" title="{{ sidebarToggleLabel }}">
        <svg data-ic="" class="sidebar-toggle-icon"><use href="#i-menu"></use></svg>
      </button>
    </sc-if>
    <div class="tt-brand navbar-brand" style="{{ brandStyle }}">
      <img src="/assets/todobox/images/todobox.svg" alt="" width="24" height="24" style="display:block;flex:0 0 auto;" />
      <span style="font-size:16px;font-weight:700 !important;letter-spacing:-0.2px;">{{ brandA }}<span class="tt-brand-box" style="font-weight:400 !important;">{{ brandB }}</span></span>
    </div>

    <div class="tt-search awesomebar" data-search-zone="" style="flex:1 1 auto;min-width:0;max-width:600px;display:flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 12px;padding-inline:12px 6px;background:var(--sunk);border:1px solid transparent;border-radius:9px;">
      <svg data-ic="" style="width:15px;height:15px;color:var(--fg3);"><use href="#i-search"></use></svg>
      <input value="{{ headerSearchValue }}" onChange="{{ onSearch }}" onFocus="{{ onSearchFocus }}" placeholder="{{ searchPlaceholder }}" aria-label="Search" style="flex:1 1 auto;min-width:0;width:100%;border:0;background:transparent;outline:none;font-size:13px;">
      <sc-if value="{{ headerHasQuery }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ clearHeaderSearch }}" aria-label="Clear search" style="width:20px;height:20px;display:grid;place-items:center;background:transparent;border:0;cursor:pointer;color:var(--fg3);">
          <svg data-ic="" style="width:13px;height:13px;"><use href="#i-x"></use></svg>
        </button>
      </sc-if>
      <button onClick="{{ toggleHints }}" title="Add filter" aria-label="Add filter" style="{{ hintsBtnStyle }}"><svg data-ic="" style="width:12px;height:12px;flex:0 0 auto;"><use href="#i-plus"></use></svg><span style="white-space:nowrap;">Filter</span></button>
      <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ false }}">
        <span class="tt-kbd" onClick="{{ openCmdk }}" title="Command palette" aria-hidden="true">{{ cmdkHint }}</span>
      </sc-if>
    </div>

    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1;"></div>

      <div style="display:flex;align-items:center;gap:2px;padding:2px;background:var(--sunk);border-radius:8px;flex:0 0 auto;">
        <sc-for list="{{ densities }}" as="dn" hint-placeholder-count="3">
          <button onClick="{{ dn.onPick }}" title="{{ dn.title }}" aria-label="{{ dn.title }}" style="{{ dn.style }}">
            <sc-if value="{{ dn.iconRef }}" hint-placeholder-val="{{ false }}">
              <svg data-ic="" style="width:14px;height:14px;"><use href="{{ dn.iconRef }}"></use></svg>
            </sc-if>
          </button>
        </sc-for>
      </div>

      <button onClick="{{ openAutomation }}" title="Rules and recurring tasks" aria-label="Automation" style="height:32px;padding:0 11px;display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line2);border-radius:8px;cursor:pointer;font-size:12px;color:var(--fg2);flex:0 0 auto;">
        <svg data-ic="" style="width:14px;height:14px;"><use href="#i-bolt"></use></svg>Automation
      </button>
    </sc-if>

    <div data-theme-menu="" style="{{ themeWrapStyle }}">
      <button onClick="{{ toggleThemeMenu }}" title="Theme" aria-label="{{ themeBtnLabel }}" aria-haspopup="dialog" aria-expanded="{{ themeMenuOpen }}" style="{{ themeBtnStyle }}">
        <svg data-ic="" style="width:16px;height:16px;"><use href="#i-palette"></use></svg>
      </button>
      <sc-if value="{{ themeMenuOpen }}" hint-placeholder-val="{{ false }}">
        <div onClick="{{ closeThemeMenu }}" style="position:fixed;inset:0;z-index:38;background:transparent;"></div>
        <div role="dialog" aria-label="{{ themeDialogLabel }}" style="position:absolute;top:40px;inset-inline-end:0;z-index:39;width:292px;max-width:88vw;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;animation:fadeup .16s var(--ease);">
          <div style="display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);">
            <span style="width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center;border-radius:8px;background:var(--primary-soft);color:var(--primary);">
              <svg data-ic="" style="width:15px;height:15px;"><use href="#i-palette"></use></svg>
            </span>
            <span style="flex:1;min-width:0;display:flex;flex-direction:column;">
              <span style="font-size:13px;font-weight:700;">Theme</span>
              <span style="font-size:11px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ themeSummary }}</span>
            </span>
            <button type="button" class="tt-x" onClick="{{ closeThemeMenu }}" aria-label="Close" title="Close"><svg data-ic=""><use href="#i-x"></use></svg></button>
          </div>
          <div style="display:flex;flex-direction:column;gap:14px;padding:13px 14px 14px;">
            <div style="display:flex;flex-direction:column;gap:7px;">
              <span id="tt-theme-mode-lbl" style="font-size:11px;font-weight:600;color:var(--fg3);">Appearance</span>
              <div role="group" aria-labelledby="tt-theme-mode-lbl" style="display:flex;gap:2px;padding:2px;background:var(--sunk);border-radius:9px;">
                <sc-for list="{{ themeModes }}" as="tm" hint-placeholder-count="3">
                  <button type="button" class="tt-theme-opt" onClick="{{ tm.onPick }}" aria-pressed="{{ tm.pressed }}" title="{{ tm.label }}" style="{{ tm.style }}">
                    <svg data-ic="" style="width:14px;height:14px;"><use href="{{ tm.iconRef }}"></use></svg>
                    <span>{{ tm.label }}</span>
                  </button>
                </sc-for>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;">
              <span style="display:flex;align-items:baseline;gap:6px;">
                <span id="tt-theme-accent-lbl" style="font-size:11px;font-weight:600;color:var(--fg3);flex:1;">Accent colour</span>
              </span>
              <div role="group" aria-labelledby="tt-theme-accent-lbl" style="display:flex;flex-wrap:wrap;gap:8px;">
                <sc-for list="{{ themeAccents }}" as="ta" hint-placeholder-count="7">
                  <button type="button" class="tt-swatch" onClick="{{ ta.onPick }}" aria-pressed="{{ ta.pressed }}" aria-label="{{ ta.label }}" title="{{ ta.label }}" style="{{ ta.style }}">
                    <sc-if value="{{ ta.pressed }}" hint-placeholder-val="{{ false }}">
                      <svg data-ic="" style="width:14px;height:14px;stroke-width:2.6;"><use href="#i-check"></use></svg>
                    </sc-if>
                  </button>
                </sc-for>
                <label class="tt-swatch" title="{{ themeCustomLabel }}" style="{{ themeCustomStyle }}">
                  <input type="color" value="{{ themeCustomValue }}" onChange="{{ onThemeCustom }}" aria-label="{{ themeCustomLabel }}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;">
                  <sc-if value="{{ themeCustomOn }}" hint-placeholder-val="{{ false }}">
                    <svg data-ic="" style="width:14px;height:14px;stroke-width:2.6;pointer-events:none;"><use href="#i-check"></use></svg>
                  </sc-if>
                  <sc-if value="{{ themeCustomOff }}" hint-placeholder-val="{{ true }}">
                    <svg data-ic="" style="width:13px;height:13px;stroke-width:2.4;pointer-events:none;"><use href="#i-plus"></use></svg>
                  </sc-if>
                </label>
              </div>
            </div>
          </div>
        </div>
      </sc-if>
    </div>

    <div style="position:relative;flex:0 0 auto;">
      <button onClick="{{ toggleNotifs }}" aria-label="{{ bellLabel }}" style="{{ bellStyle }}">
        <svg data-ic="" style="width:16px;height:16px;"><use href="#i-bell"></use></svg>
        <span style="{{ bellBadge }}">{{ notifUnread }}</span>
      </button>
      <sc-if value="{{ notifsOpen }}" hint-placeholder-val="{{ false }}">
        <div onClick="{{ closeNotifs }}" style="position:fixed;inset:0;z-index:38;background:transparent;"></div>
        <div style="position:absolute;top:40px;inset-inline-end:0;width:376px;max-width:88vw;z-index:39;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-lg);overflow:hidden;animation:fadeup .16s var(--ease);">
          <div style="display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);">
            <span style="font-size:13px;font-weight:700;flex:1;">Notifications</span>
            <button onClick="{{ markAllRead }}" style="background:transparent;border:0;cursor:pointer;font-size:11px;color:var(--primary);">Mark all as read</button>
            <button type="button" class="tt-x" onClick="{{ closeNotifs }}" aria-label="Close" title="Close"><svg data-ic=""><use href="#i-x"></use></svg></button>
          </div>
          <div style="max-height:min(58vh,420px);overflow-y:auto;">
            <sc-for list="{{ notifs }}" as="n" hint-placeholder-count="5">
              <button onClick="{{ n.onOpen }}" style="{{ n.style }}">
                <span style="{{ n.iconWrap }}"><svg data-ic="" style="width:14px;height:14px;"><use href="{{ n.iconRef }}"></use></svg></span>
                <span style="flex:1;min-width:0;text-align:start;">
